[workspace]
members = ["src-tauri", "crates/*"]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "=0.17.3"
kuerdas-dsp = { path = "crates/kuerdas-dsp" }
kuerdas-audio = { path = "crates/kuerdas-audio" }
kuerdas-devices = { path = "crates/kuerdas-devices" }
